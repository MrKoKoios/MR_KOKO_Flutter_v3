
name: Build MR KOKO APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Fix Overlay Window Manifest
        run: |
          MANIFEST="$HOME/.pub-cache/hosted/pub.dev/flutter_overlay_window-0.3.3/android/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/package="com.example.flutter_overlay_window"//' "$MANIFEST"
          else
            echo "Overlay Window Manifest not found"
            exit 1
          fi

      - name: Build APK
        run: flutter build apk --release --no-obfuscate

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MR-KOKO-SignalPro
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
